/* ---------- ensokit palette + design tokens ---------- */

:root {
  /* ensokit palette — exact */
  --ink: #211E19;
  --ink-soft: #4A443B;
  --washi: #F7F4ED;
  --washi-shade: #EDE7DA;
  --night-bg: #161310;
  --night-ink: #EDE7DA;
  --vermillion: #D95B31;
  --vermillion-deep: #B9451F;
  --gold: #D4AE52;
  --indigo: #2F6B93;
  --teal: #22786B;
  --moss: #5A6B3B;

  /* rgb triplets for alpha composition */
  --washi-rgb: 247, 244, 237;
  --vermillion-rgb: 217, 91, 49;
  --moss-rgb: 90, 107, 59;
  --gold-rgb: 212, 174, 82;
  --teal-rgb: 34, 120, 107;
  --indigo-rgb: 47, 107, 147;

  /* phase accent — default brand vermillion; body[data-phase] overrides */
  --accent: var(--vermillion);
  --accent-deep: var(--vermillion-deep);
  --accent-rgb: var(--vermillion-rgb);
  /* text-safe accent: the raw phase accents sit near 3:1 on the night glass,
     fine for borders/glows/large numerals but below WCAG 4.5:1 for small
     text. --accent-text is each accent mixed ~55% toward washi and is what
     small accent-colored text (active nav/pills, labels) must use. */
  --accent-text: #E9997D;

  /* derived accent tints */
  --accent-soft: rgba(var(--accent-rgb), 0.16);
  --accent-glow: rgba(var(--accent-rgb), 0.34);
  --accent-line: rgba(var(--accent-rgb), 0.45);

  /* glass recipe */
  --glass-grad: linear-gradient(135deg, rgba(247, 244, 237, 0.10), rgba(247, 244, 237, 0.04));
  --glass-grad-strong: linear-gradient(135deg, rgba(247, 244, 237, 0.15), rgba(247, 244, 237, 0.06));
  --glass-border: 1px solid rgba(247, 244, 237, 0.16);
  --glass-specular: inset 0 1px 0 rgba(255, 255, 255, 0.22);
  --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  --glass-blur: blur(22px) saturate(1.5);
  --glass-blur-strong: blur(30px) saturate(1.6);
  --radius-card: 22px;
  --radius-pill: 999px;

  /* type */
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Source Serif 4', Georgia, serif;

  /* text on glass — never pure white/black */
  --text: var(--night-ink);
  --text-dim: rgba(237, 231, 218, 0.72);
  --text-faint: rgba(237, 231, 218, 0.62); /* ≥4.5:1 over the glass cards */

  /* safe areas */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

/* ---------- per-phase accent (data-phase on <body>) ---------- */

/* Derived tints must resolve on <body>, where data-phase overrides
   --accent-rgb — custom properties substitute var() at the element
   they are declared on, so :root-level tints would freeze on vermillion. */
body {
  --accent-soft: rgba(var(--accent-rgb), 0.16);
  --accent-glow: rgba(var(--accent-rgb), 0.34);
  --accent-line: rgba(var(--accent-rgb), 0.45);
}

body[data-phase='menstrual'] {
  --accent: var(--vermillion);
  --accent-deep: var(--vermillion-deep);
  --accent-rgb: var(--vermillion-rgb);
  --accent-text: #E9997D;
}
body[data-phase='follicular'] {
  --accent: var(--moss);
  --accent-deep: #46542D;
  --accent-rgb: var(--moss-rgb);
  --accent-text: #9DAE7E;
}
body[data-phase='ovulation'] {
  --accent: var(--gold);
  --accent-deep: #B08F3A;
  --accent-rgb: var(--gold-rgb);
  --accent-text: var(--gold); /* gold already clears 4.5:1 on the night glass */
}
body[data-phase='earlyLuteal'] {
  --accent: var(--teal);
  --accent-deep: #1A5F54;
  --accent-rgb: var(--teal-rgb);
  --accent-text: #7FB5AB;
}
body[data-phase='lateLuteal'] {
  --accent: var(--indigo);

}

/* ---------- base ---------- */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { height: 100%; }

body {
  margin: 0;
  min-height: 100%;
  background: var(--night-bg);
  color: var(--text);
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

/* the ink world: fixed full-screen background layer (holds Enso.bg svg) */
.bg-ink {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: var(--night-bg);
  transition: opacity 1.2s ease;
}
.bg-ink svg { display: block; width: 100%; height: 100%; }

/* everything interactive floats above the ink */
.app, main, .screen { position: relative; z-index: 1; }

.screen {
  max-width: 480px;
  margin: 0 auto;
  padding: calc(16px + var(--safe-top)) calc(16px + var(--safe-right)) calc(108px + var(--safe-bottom)) calc(16px + var(--safe-left));
}

/* ---------- typography scale ---------- */

h1, h2, h3, h4, .t-display, .t-title, .t-h {
  font-family: var(--font-display);
  color: var(--text);
  margin: 0 0 0.35em;
  font-weight: 500;
  line-height: 1.14;
  letter-spacing: 0.005em;
}

.t-display, h1 { font-size: 2.35rem; font-weight: 500; }
.t-title, h2 { font-size: 1.7rem; font-weight: 500; }
.t-h, h3 { font-size: 1.28rem; font-weight: 600; }
h4 { font-size: 1.08rem; font-weight: 600; }

.t-body, p { font-size: 1rem; margin: 0 0 0.7em; }
.t-small { font-size: 0.86rem; color: var(--text-dim); }
.t-faint { color: var(--text-faint); }
.t-em { font-style: italic; }
.t-accent { color: var(--accent-text); }
/* the large countdown numeral (54px) passes WCAG large-text 3:1 with the raw
   accent — keep the phase mood there */
.t-num.t-accent { color: var(--accent); }

/* big countdown numbers — Cormorant Garamond 500-600 */
.t-num {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 3.4rem;
  line-height: 1;
  letter-spacing: -0.01em;
  font-variant-numeric: lining-nums;
}
.t-num-sub {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.5rem;
  line-height: 1.1;
}

/* small caps-ish label */
.t-label {
  font-family: var(--font-body);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-faint);
}

/* ---------- liquid glass primitives ---------- */

.glass,
.glass-card,
.glass-pill,
.glass-btn,
.glass-nav {
  background: var(--glass-grad);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border: var(--glass-border);
  box-shadow: var(--glass-specular), var(--glass-shadow);
  color: var(--text);
}

.glass-card {
  border-radius: var(--radius-card);
  padding: 18px 18px 16px;
  margin-bottom: 14px;
}

.glass-card.accent {
  border-color: var(--accent-line);
  box-shadow: var(--glass-specular), 0 8px 32px rgba(0, 0, 0, 0.35), 0 0 44px -8px var(--accent-glow);
}

/* pills — smaller glass, stronger blur */
.glass-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border-radius: var(--radius-pill);
  padding: 7px 14px;
  font-size: 0.88rem;
  -webkit-backdrop-filter: var(--glass-blur-strong);
  backdrop-filter: var(--glass-blur-strong);
  background: var(--glass-grad-strong);
}
.glass-pill.accent {
  border-color: var(--accent-line);
  color: var(--accent);
  box-shadow: var(--glass-specular), 0 4px 18px rgba(0, 0, 0, 0.3), 0 0 22px -4px var(--accent-glow);
}
.glass-pill svg { width: 1em; height: 1em; }

/* buttons */
.glass-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 16px;
  padding: 12px 18px;
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-backdrop-filter: var(--glass-blur-strong);
  backdrop-filter: var(--glass-blur-strong);
  background: var(--glass-grad-strong);
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
}
.glass-btn svg { width: 1.15em; height: 1.15em; }
.glass-btn:active,

}
.glass-btn.primary {
  background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.34), rgba(var(--accent-rgb), 0.16));
  border-color: rgba(var(--accent-rgb), 0.55);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 8px 28px rgba(0, 0, 0, 0.35), 0 0 30px -6px var(--accent-glow);
}
.glass-btn.small { padding: 8px 13px; font-size: 0.85rem; border-radius: 13px; }
.glass-btn.block { display: flex; width: 100%; }

/* ---------- phase banner ---------- */

.phase-banner {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-card);
  padding: 20px 20px 18px;
  margin-bottom: 14px;
  background: var(--glass-grad);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--accent-line);
  box-shadow: var(--glass-specular), var(--glass-shadow), 0 0 60px -10px var(--accent-glow);
}
.phase-banner::before {
  content: '';
  position: absolute;
  inset: -40% -20% auto;
  height: 130%;
  background: radial-gradient(ellipse at 30% 0%, rgba(var(--accent-rgb), 0.22), transparent 62%);
  pointer-events: none;
}
.phase-banner > * { position: relative; }
.phase-banner .phase-name {
  font-family: var(--font-display);
  font-size: 1.85rem;
  font-weight: 500;
  color: var(--text);
  margin: 2px 0 4px;
  line-height: 1.1;
}
.phase-banner .phase-glyph {
  position: absolute;
  right: 6px;
  top: 4px;
  width: 74px;
  height: 74px;
  color: var(--accent);
  opacity: 0.85;
}

/* ---------- glass bottom nav ---------- */

.glass-nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(12px + var(--safe-bottom));
  z-index: 30;
  display: flex;
  align-items: stretch;
  gap: 2px;
  width: min(94vw, 440px);
  border-radius: 26px;
  padding: 8px 6px;
  -webkit-backdrop-filter: var(--glass-blur-strong);
  backdrop-filter: var(--glass-blur-strong);
  background: var(--glass-grad-strong);
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 2px 4px;
  border-radius: 18px;
  border: 1px solid transparent;
  color: var(--text-faint);
  font-family: var(--font-body);
  font-size: 0.62rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  background: transparent;
  transition: color 0.15s ease, background 0.15s ease, transform 0.12s ease;
}
.nav-item svg { width: 26px; height: 26px; }
.nav-item:active { transform: scale(0.94); }
.nav-item.active {
  color: var(--accent-text);
  background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.20), rgba(var(--accent-rgb), 0.08));
  border-color: rgba(var(--accent-rgb), 0.35);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 0 20px -4px var(--accent-glow);
}

/* ---------- misc UI ---------- */

.divider {
  border: none;
  height: 1px;
  margin: 14px 0;
  background: linear-gradient(90deg, transparent, rgba(var(--washi-rgb), 0.18), transparent);
}

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }

.glyph { display: inline-block; vertical-align: -0.15em; }
.glyph svg { display: block; }

.icon-accent { color: var(--accent); }
.icon-dim { color: var(--text-dim); }

/* glass list rows (tips, history) */
.glass-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid rgba(var(--washi-rgb), 0.08);
}

.glass-row .row-glyph { flex: 0 0 auto; width: 30px; height: 30px; color: var(--accent); margin-top: 2px; }

/* severity / warning tone */
.tone-warn { color: var(--gold); }

/* scrollbars stay quiet */
::-webkit-scrollbar { width: 0; height: 0; }

/* reduced motion */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }

<script>
/* ensokit.js — browser port of the EnsoKit sumi-e brush engine + curated glyphs.
   Deterministic hand-brushed marks: same seed -> same marks.
   Plain browser script: attaches window.Enso = { svg, bg, names }.  */
(function () {
  'use strict';

  /* ============ brush engine (ported verbatim from assets/brush.js) ============ */

  function hash32(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function rng(seed) {
    let a = hash32(String(seed));
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* single brush ring as a filled path: tapered ends, organic wobble, open gap. */
  function ensoPoints(seed, opts) {
    opts = opts || {};
    const r = rng(seed);
    const R = opts.R || 36, W = opts.w || 11;
    const cx = opts.cx !== undefined ? opts.cx : 50;
    const cy = opts.cy !== undefined ? opts.cy : 50;
    const rot = opts.rot !== undefined ? opts.rot : r() * Math.PI * 2;
    const gap = opts.gap !== undefined ? opts.gap : 0.55 + r() * 0.8;
    const span = Math.PI * 2 - gap;
    const wob = (opts.wob !== undefined ? opts.wob : (2 + r() * 2.4)) * (R / 36);
    const ph1 = r() * Math.PI * 2, ph2 = r() * Math.PI * 2;
    const N = 44, outer = [], inner = [];
    for (let k = 0; k <= N; k++) {
      const t = k / N, th = rot + t * span;
      const w = W * (0.3 + 0.7 * Math.pow(1 - t, 1.3)) * Math.min(1, 0.15 + t * 6);
      const rad = R + Math.sin(t * Math.PI * 2 + ph1) * wob * 0.5 + Math.sin(t * Math.PI * 5 + ph2) * 0.8 * (R / 36);
      const co = Math.cos(th), si = Math.sin(th);
      outer.push([cx + co * (rad + w / 2), cy + si * (rad + w / 2)]);
      inner.push([cx + co * (rad - w / 2), cy + si * (rad - w / 2)]);
    }
    return outer.concat(inner.reverse());
  }

  /* Catmull-Rom resampling of a polyline */
  function crSpline(a, b, c, d, t) {
    return 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (-a + 3 * b - 3 * c + d) * t * t * t);

  function resample(pts, N) {
    const out = [];
    if (pts.length < 3) {

        const t = k / N;
        out.push([pts[0][0] + (pts[1][0] - pts[0][0]) * t, pts[0][1] + (pts[1][1] - pts[0][1]) * t]);
      }
      return out;
    }
    const P = [pts[0]].concat(pts, [pts[pts.length - 1]]);
    const segs = pts.length - 1;
    for (let k = 0; k <= N; k++) {
      const t = k / N * segs;
      const i = Math.min(Math.floor(t), segs - 1), u = t - i;
      out.push([
        crSpline(P[i][0], P[i + 1][0], P[i + 2][0], P[i + 3][0], u),

  }

  /* brush stroke along a polyline -> closed filled contour points */
  function strokePoints(seed, pts, w, o) {
    o = o || {};
    const r = rng(seed);
    const N = Math.max(14, pts.length * 6);
    const P = resample(pts, N);
    const ph = r() * 6.28, wob = 0.7 + r();
    const L = [], R = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const a = P[Math.max(0, i - 1)], b = P[Math.min(N, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;

        ? w * (0.25 + 0.75 * Math.sin(Math.PI * t))

          : w * (0.3 + 0.7 * Math.pow(1 - t, 1.15)) * Math.min(1, 0.15 + t * 6);
      wt += Math.sin(t * 9 + ph) * wob * 0.4;
      if (wt < 0.6) wt = 0.6;
      L.push([P[i][0] + nx * wt / 2, P[i][1] + ny * wt / 2]);
      R.push([P[i][0] - nx * wt / 2, P[i][1] - ny * wt / 2]);

    return L.concat(R.reverse());

  /* irregular ink dot -> closed contour (organic blob, not a perfect circle) */
  function dotPoints(seed, cx, cy, rad) {
    const r = rng(seed + '|dot');
    const ph = r() * 6.28, amp = 0.12 + r() * 0.1;

      out.push([cx + Math.cos(th) * rr, cy + Math.sin(th) * rr]);
    }

  }

    }

  }

  /* arc helper: partial ring polyline (for mouths, brows, waves) */
  function arcPts(cx, cy, R, a0, a1, n) {
    n = n || 8;
    const pts = [];

  function motifContours(motif, seed) {
    const contours = [];
    if (motif.enso) contours.push(ensoPoints(seed + '|ring', motif.enso));

    const pool = ['wave', 'sprout', 'blossom', 'crescent', 'leaf', 'spiral', 'drop', 'fog', 'star', 'moon-full'];

        rows += '<div class="glass-row"><div class="row-glyph' + (p.source === 'predicted' ? ' t-faint' : '') + '">' +
          g(p.source === 'predicted' ? 'question' : 'drop', 30) + '</div><div>' +
          '<strong>' + niceDateYear(p.start) + '</strong>' +
          '<div class="t-small">' + srcTxt + (p.end ? ' · ended ' + niceDate(p.end) : '') + '</div></div>' +
          '<span class="hist-len">' + lenTxt + '</span>' +
          '<button class="glass-pill pill-x" data-delperiod="' + p.start + '" title="Remove this entry" aria-label="Remove period entry ' + p.start + '" style="align-self:center">×</button></div>';
      }
      h += rows;
    }
    h += '</div>';

    /* --- check-in history --- */
    h += '<div class="glass-card"><div class="t-label">Check-in history</div>';
    if (!state.checkins.length) {
      h += '<div class="empty-state"><div class="row-glyph">' + g('speech', 46) + '</div>No check-ins yet — log the first one above.</div>';
    } else {
      var cs = state.checkins.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 12);
      h += cs.map(function (c) {
        var m = moodByKey(c.mood);
        return '<div class="glass-row"><div class="row-glyph">' + g(m ? m.glyph : 'speech', 30) + '</div><div>' +
          '<strong>' + esc(m ? m.label : c.mood) + '</strong>' +
          (c.severity ? ' <span class="t-small' + (c.severity === 'severe' ? ' tone-danger' : '') + '">(' + esc(c.severity) + ')</span>' : '') +
          '<div class="t-small">' + niceDate(c.date) + ' · day ' + esc(String(c.cycleDay)) + ' · ' + esc(PHASE_SHORT[c.phase] || c.phase) +
          (c.symptoms && c.symptoms.length ? ' · ' + c.symptoms.map(function (s) { var o = symptomByKey(s); return esc(o ? o.label : s); }).join(', ') : '') + '</div>' +
          (c.note ? '<div class="t-small t-em">“' + esc(c.note) + '”</div>' : '') +
          '</div></div>';
      }).join('');
    }
    h += '</div>';
    return h;
  }

  /* --------------------------- check-in flow ----------------------------- */

  function viewCheckinFlow(ph) {
    var h = '<div class="screen-title"><h2>Mood check-in</h2>' +
      '<div class="t-small">' + niceDateYear(E.today()) + ' · cycle day ' + ph.cycleDay + ' · ' + esc(PHASE_SHORT[ph.key]) + '</div></div>';

      h += '<div class="glass-card"><div class="t-label">Step 1 · how is she?</div>' +
        '<div class="mood-grid">' + C.moods.map(function (m) {
          return '<button class="mood-cell' + (flow.mood === m.key ? ' sel' : '') + '" data-mood="' + m.key + '" id="mood-' + m.key + '">' +
            g(m.glyph, 34) + '<span>' + esc(m.label) + '</span></button>';
        }).join('') + '</div></div>' +
        '<div class="stack-btns"><button class="glass-btn" data-action="cancel-checkin">' + g('arrow-left', 16) + ' Cancel</button></div>';

    }

        '<div class="row-glyph">' + g(m.glyph, 30) + '</div><div><strong>' + esc(m.label) + '</strong>' +
        '<div class="t-small">Optional details — skip anything you don’t know.</div></div></div></div>';

      h += '<div class="glass-card"><div class="t-label">Symptoms she mentioned</div><div class="chip-row" style="margin-top:10px">' +
        C.symptoms.map(function (s) {
          var on = flow.symptoms.indexOf(s.key) >= 0;
          return '<button class="glass-pill' + (on ? ' sel' : '') + '" data-symptom="' + s.key + '">' + esc(s.label) + '</button>';
        }).join('') + '</div></div>';

      h += '<div class="glass-card"><div class="t-label">How strong is it?</div><div class="chip-row" style="margin-top:10px">' +
        SEVERITIES.map(function (s) {
          return '<button class="glass-pill' + (flow.severity === s ? ' sel' : '') + '" data-severity="' + s + '" id="sev-' + s + '">' + s + '</button>';
        }).join('') + '</div></div>';

      h += '<div class="glass-card"><div class="t-label">Note</div>' +
        '<textarea id="ci-note" class="glass-input" rows="2" style="margin-top:8px" placeholder="One line — what she said, what happened…">' + esc(flow.note) + '</textarea></div>';

      h += '<div class="stack-btns">' +
        '<button class="glass-btn" data-action="back-to-mood">' + g('arrow-left', 16) + ' Back</button>' +
        '<button class="glass-btn primary" data-action="save-checkin" id="saveCheckin">' + g('check', 16) + ' Save check-in</button></div>';
      return h;
    }

    /* result */
    var c = flow.saved;
    var m2 = moodByKey(c.mood);
    var phaseContent = C.phases[c.phase];
    var mm = phaseContent && phaseContent.moods ? phaseContent.moods[c.mood] : null;

    h += '<div class="glass-card accent" id="ci-result">' +
      '<div class="glass-row" style="border:none;padding:2px 0 8px"><div class="row-glyph">' + g(m2.glyph, 30) + '</div>' +
      '<div><strong>' + esc(m2.label) + '</strong> · <span class="t-small">' + esc(PHASE_SHORT[c.phase]) + ', cycle day ' + c.cycleDay + '</span></div></div>';
    if (mm) {
      h += '<div class="t-label">What’s likely happening</div>' +
        '<p class="t-body" style="margin-top:5px" id="ci-explain">' + esc(mm.explain) + '</p>';
    }
    h += '</div>';

    if (mm && mm.typical === false) {
      // A good mood that's off-script is a gift, not a symptom — no warning
      // glyph, no "probe her feelings" framing for positive moods.
      var positiveMood = c.mood === 'fine' || c.mood === 'affectionate' || c.mood === 'energetic';
      if (positiveMood) {
        h += '<div class="glass-card tone-note" id="ci-atypical"><div class="glass-row" style="border:none;padding:0">' +
          '<div class="row-glyph icon-accent">' + g('sparkle', 30) + '</div><div>' +
          '<div class="t-label">Not the textbook mood for this phase</div>' +
          '<div class="t-small" style="color:var(--text-dim)">Cycles vary, and a good day here is simply a good day — enjoy it together rather than analysing it.</div></div></div></div>';
      } else {
        h += '<div class="glass-card tone-note" id="ci-atypical"><div class="glass-row" style="border:none;padding:0">' +
          '<div class="row-glyph tone-warn">' + g('warning', 30) + '</div><div>' +
          '<div class="t-label">Less typical for this phase</div>' +
          '<div class="t-small" style="color:var(--text-dim)">' + esc(C.general.atypicalNote) + '</div></div></div></div>';
      }
    }

      h += '<div class="glass-card"><div class="t-label">What to do right now</div>' +

        '<div class="t-label">Worth keeping an eye on</div>' +
        '<div class="t-small" style="color:var(--text-dim)">' + esc(C.general.severityNudge) + '</div></div></div></div>';
    }

    h += '<div class="stack-btns"><button class="glass-btn primary" data-action="finish-checkin" id="finishCheckin">' + g('check', 16) + ' Done</button></div>';

  }

  /* -------------------------------- MAP ---------------------------------- */

  function phaseKeyForDay(day, L, periodLen, lutealLen) {
    var ov = L + 1 - lutealLen; // ovulation cycle day (next start = day L+1)
    var lateStart = L - E.LATE_LUTEAL_DAYS + 1;
    if (day <= periodLen) return 'menstrual';
    if (day >= lateStart) return 'lateLuteal';
    if (Math.abs(day - ov) <= 1) return 'ovulation';
    if (day < ov) return 'follicular';
    return 'earlyLuteal';
  }

  function viewMap(ph) {
    var curve = E.moodCurve(state);
    var L = curve.length;
    var periodLen = state.settings.periodLength;
    var lutealLen = state.settings.lutealLength;

    var W = 360, H = 210, padL = 26, padR = 12, padT = 16, padB = 30;
    var iw = W - padL - padR, ihh = H - padT - padB;
    function X(day) { return padL + (day - 1) / (L - 1) * iw; }
    function Y(v) { return padT + (1 - v) * ihh; }

    var svg = '<svg class="map-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';

    /* phase bands */
    var d0 = 1;
    for (var d = 2; d <= L + 1; d++) {
      var kPrev = phaseKeyForDay(d0, L, periodLen, lutealLen);
      var kCur = d <= L ? phaseKeyForDay(d, L, periodLen, lutealLen) : null;
      if (kCur !== kPrev) {
        svg += '<rect x="' + X(d0).toFixed(1) + '" y="' + padT + '" width="' + (X(d - 1) - X(d0) + iw / (L - 1)).toFixed(1) +
          '" height="' + ihh + '" fill="' + PHASE_HEX[kPrev] + '" opacity="0.07"/>';
        svg += '<rect x="' + X(d0).toFixed(1) + '" y="' + (padT + ihh + 3) + '" width="' + (X(d - 1) - X(d0) + iw / (L - 1)).toFixed(1) +
          '" height="3" rx="1.5" fill="' + PHASE_HEX[kPrev] + '" opacity="0.55"/>';
        d0 = d;
      }
    }

    /* pain-day markers (profile pain days) */
    var painDays = [];
    (state.profile.patterns || []).forEach(function (p) {
      if (p.phase === 'menstrual' && Array.isArray(p.days) && /pain|cramp/i.test(p.symptom || '')) painDays = painDays.concat(p.days);
    });
    painDays.forEach(function (pd) {
      if (pd >= 1 && pd <= L) svg += '<line x1="' + X(pd).toFixed(1) + '" y1="' + (padT + ihh - 8) + '" x2="' + X(pd).toFixed(1) +
        '" y2="' + (padT + ihh) + '" stroke="#D95B31" stroke-width="2" opacity="0.8"/>';
    });

    /* expected curve + soft area */
    var line = curve.map(function (p, i) { return (i ? 'L' : 'M') + X(p.cycleDay).toFixed(1) + ' ' + Y(p.expected).toFixed(1); }).join(' ');
    svg += '<path d="' + line + ' L' + X(L).toFixed(1) + ' ' + (padT + ihh) + ' L' + X(1).toFixed(1) + ' ' + (padT + ihh) +
      ' Z" fill="' + PHASE_HEX[ph.key] + '" opacity="0.10"/>';
    svg += '<path d="' + line + '" fill="none" stroke="' + PHASE_HEX[ph.key] + '" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>';

    /* today marker */
    var td = Math.min(ph.cycleDay, L);
    svg += '<line x1="' + X(td).toFixed(1) + '" y1="' + padT + '" x2="' + X(td).toFixed(1) + '" y2="' + (padT + ihh) +
      '" stroke="#EDE7DA" stroke-width="1" stroke-dasharray="3 4" opacity="0.55"/>' +
      '<text x="' + X(td).toFixed(1) + '" y="' + (padT - 4) + '" text-anchor="middle" font-size="9" fill="#EDE7DA" opacity="0.8">today</text>';

    /* check-in dots */
    state.checkins.forEach(function (c) {
      var day = Math.max(1, Math.min(L, c.cycleDay || 1));
      var v = MOOD_VALENCE[c.mood]; if (typeof v !== 'number') v = 0.5;
      svg += '<circle cx="' + X(day).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="4.4" fill="' + (PHASE_HEX[c.phase] || '#EDE7DA') +
        '" stroke="#EDE7DA" stroke-width="1.1" opacity="0.95"/>';
    });

    /* axis labels */
    [1, 7, 14, 21, L].forEach(function (d2) {
      svg += '<text x="' + X(d2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9" fill="#EDE7DA" opacity="0.55">' + d2 + '</text>';
    });
    svg += '<text x="8" y="' + (padT + 8) + '" font-size="9" fill="#EDE7DA" opacity="0.55">high</text>' +
      '<text x="8" y="' + (padT + ihh) + '" font-size="9" fill="#EDE7DA" opacity="0.55">low</text>';
    svg += '</svg>';

    var h = '<div class="screen-title"><h2>Cycle mood map</h2>' +
      '<div class="t-small">Expected mood &amp; energy across her ' + L + '-day cycle — her check-ins overlay as dots.</div></div>';

    h += '<div class="glass-card accent">' + svg +
      '<div class="legend-row">' +
      E.PHASE_ORDER.map(function (k) {
        return '<span><span class="sw" style="background:' + PHASE_HEX[k] + '"></span>' + PHASE_SHORT[k] + '</span>';
      }).join('') +
      '<span><span class="sw" style="background:#D95B31;border-radius:1px;height:4px;width:12px"></span>pain days 1–3</span>' +
      '</div></div>';

    /* per-phase summary cards */
    h += '<div class="glass-card"><div class="t-label">Per-phase check-in summary</div>';
    var any = false;
    E.PHASE_ORDER.forEach(function (k) {
      var cs = state.checkins.filter(function (c) { return c.phase === k; });
      if (!cs.length) return;
      any = true;
      var counts = {};
      cs.forEach(function (c) { counts[c.mood] = (counts[c.mood] || 0) + 1; });
      var parts = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; })
        .map(function (mk) { var m = moodByKey(mk); return esc((m ? m.label : mk)) + ' ×' + counts[mk]; });
      h += '<div class="glass-row"><div class="row-glyph" style="color:' + PHASE_HEX[k] + '">' + g(PHASE_GLYPH[k], 30) + '</div><div>' +
        '<strong>' + PHASE_SHORT[k] + '</strong> — ' + cs.length + ' check-in' + (cs.length > 1 ? 's' : '') +
        '<div class="t-small">' + parts.join(' · ') + '</div></div></div>';
    });
    if (!any) {
      h += '<div class="empty-state"><div class="row-glyph">' + g('chart', 46) + '</div>' +
        'No check-ins yet. Over 2–3 cycles her real pattern will emerge here against the expected curve.</div>';
    }
    h += '</div>';
    return h;
  }

      '<div class="setting-row"><span>Luteal length (days)</span><input type="number" step="1" min="9" max="17" class="glass-input num-input" id="set-lutealLength" data-setting="lutealLength" value="' + s.lutealLength + '"></div>' +

  /* ------------------------------ actions -------------------------------- */

  function syncFlowInputs() {
    if (flow && flow.step === 'details') {
      var n = document.getElementById('ci-note');
      if (n) flow.note = n.value;
    }
  }

  function download(name, text) {
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
  }

  var ACTIONS = {
    'start-checkin': function () { tab = 'log'; flow = { step: 'mood', mood: null, symptoms: [], severity: '', note: '' }; window.scrollTo(0, 0); },
    'cancel-checkin': function () { flow = null; window.scrollTo(0, 0); },
    'back-to-mood': function () { flow.step = 'mood'; window.scrollTo(0, 0); },
    'save-checkin': function () {
      var c = {
        date: E.today(), mood: flow.mood, symptoms: flow.symptoms.slice(),
        note: flow.note || '', severity: flow.severity || ''
      };
      var next = E.addCheckin(state, c);
      commit(next);
      flow.saved = next.checkins[next.checkins.length - 1];
      flow.step = 'result';
      window.scrollTo(0, 0);
    },
    'finish-checkin': function () { flow = null; window.scrollTo(0, 0); },
    // Destructive (consumes the pending prediction and reflows everything),
    // so it takes two taps: arm, then confirm.
    'period-today': function () {
      if (!confirmStart) { confirmStart = true; return; }
      confirmStart = false;
      tab = 'log'; flow = null;
      commit(E.confirmPeriodStart(state, E.today()));
    },
    'period-end-today': function () {
      // If the current menstrual window hangs off a still-predicted entry,
      // confirm that start first — otherwise the end date would be attached
      // to a predicted entry and silently discarded on the real confirm.
      var t = E.today();
      var cur = E.phaseOf(state, t);
      var anchorEntry = null;
      E.effectivePeriods(state).forEach(function (p) { if (p.start === cur.cycleStart) anchorEntry = p; });
      var st = state;
      if (anchorEntry && anchorEntry.source === 'predicted') st = E.confirmPeriodStart(st, anchorEntry.start);
      commit(E.endPeriod(st, t));
    },
    'toggle-start-picker': function () { showStartPicker = !showStartPicker; logMsg = null; },
    'period-on-date': function () {
      var el = document.getElementById('startDate');
      var v = el && el.value;
      if (!v || !E.isDateStr(v)) { logMsg = 'Pick a valid date first.'; return; }
      if (v > E.today()) { logMsg = 'A period start can’t be in the future — pick a date on or before today.'; return; }
      logMsg = null;
      commit(E.confirmPeriodStart(state, v));
      showStartPicker = false;
    },
    'add-pattern': function () {
      var sym = document.getElementById('pat-symptom').value.trim();
      if (!sym) { settingsMsg = { text: 'Give the pattern a symptom name first.', tone: 'err' }; return; }
      var p = {
        phase: document.getElementById('pat-phase').value,
        symptom: sym,
        severity: document.getElementById('pat-severity').value
      };
      var note = document.getElementById('pat-note').value.trim();
      if (note) p.note = note;
      var next = JSON.parse(JSON.stringify(state));
      next.profile.patterns.push(p);
      commit(next);
      settingsMsg = { text: 'Pattern added.', tone: 'ok' };
    },
    'export': function () {
      download('attune-backup-' + E.today() + '.json', E.exportJSON(state));
      settingsMsg = { text: 'Backup downloaded.', tone: 'ok' };
    },
    'import': function () {
      var f = document.getElementById('importFile');
      if (f) f.click();
    },
    'clear': function () {
      if (!confirmClear) { confirmClear = true; return; }
      confirmClear = false;
      commit(E.seedState());
      settingsMsg = { text: 'All data cleared — back to the starting seed.', tone: 'ok' };
    }
  };

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-nav],[data-action],[data-mood],[data-symptom],[data-severity],[data-fphase],[data-fcat],[data-delpattern],[data-delperiod]');
    if (!el) return;

    syncFlowInputs();

    if (el.hasAttribute('data-nav')) {
      tab = el.getAttribute('data-nav');
      if (tab !== 'log') flow = null;
      confirmClear = false; confirmStart = false; settingsMsg = null; logMsg = null;
      window.scrollTo(0, 0);
    } else if (el.hasAttribute('data-mood')) {
      flow.mood = el.getAttribute('data-mood');
      flow.step = 'details';
      window.scrollTo(0, 0);
    } else if (el.hasAttribute('data-symptom')) {
      var k = el.getAttribute('data-symptom');
      var i = flow.symptoms.indexOf(k);
      if (i >= 0) flow.symptoms.splice(i, 1); else flow.symptoms.push(k);
    } else if (el.hasAttribute('data-severity')) {
      var sv = el.getAttribute('data-severity');
      flow.severity = flow.severity === sv ? '' : sv;
    } else if (el.hasAttribute('data-fphase')) {
      tipsPhase = el.getAttribute('data-fphase');
    } else if (el.hasAttribute('data-fcat')) {
      tipsCat = el.getAttribute('data-fcat');
    } else if (el.hasAttribute('data-delpattern')) {
      var idx = +el.getAttribute('data-delpattern');
      var next = JSON.parse(JSON.stringify(state));
      next.profile.patterns.splice(idx, 1);
      commit(next);
    } else if (el.hasAttribute('data-delperiod')) {
      var ds = el.getAttribute('data-delperiod');
      var next2 = JSON.parse(JSON.stringify(state));
      next2.periods = next2.periods.filter(function (p) { return p.start !== ds; });
      commit(next2);
    } else {
      var act = el.getAttribute('data-action');
      if (act !== 'clear') confirmClear = false;
      if (act !== 'period-today') confirmStart = false;
      if (ACTIONS[act]) ACTIONS[act]();
    }
    render();
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t && t.hasAttribute && t.hasAttribute('data-setting')) {
      var key = t.getAttribute('data-setting');
      var v = parseFloat(t.value);
      if (isFinite(v) && v > 0) {
        // typed values must respect the input's own min/max/step — a typo like
        // "2" for cycle length would otherwise silently corrupt every prediction
        var mn = parseFloat(t.min), mx = parseFloat(t.max), stp = parseFloat(t.step);
        if (isFinite(stp) && stp >= 1) v = Math.round(v / stp) * stp;
        if (isFinite(mn)) v = Math.max(mn, v);
        if (isFinite(mx)) v = Math.min(mx, v);
        t.value = v;
        var next = JSON.parse(JSON.stringify(state));
        next.settings[key] = v;
        commit(next);
        render();
      } else {
        t.value = state.settings[key]; // reject nonsense, restore stored value
      }
    } else if (t && t.hasAttribute && t.hasAttribute('data-profile')) {
      var nextP = JSON.parse(JSON.stringify(state));
      nextP.profile.name = String(t.value == null ? '' : t.value).trim().slice(0, 24);
      commit(nextP);
      render();
    } else if (t && t.id === 'importFile' && t.files && t.files[0]) {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var imported = E.importJSON(String(reader.result));
          commit(imported);
          settingsMsg = { text: 'Import successful — data restored.', tone: 'ok' };
        } catch (e) {
          settingsMsg = { text: 'Import failed: ' + e.message, tone: 'err' };
        }
        render();
      };
      reader.readAsText(t.files[0]);
    }
  });

  /* ------------------------------ test hook ------------------------------ */

  window.__setToday = function (dateStr) {
    E.setToday(dateStr);
    render();
    return E.today();
  };

  /* ------------------------------ pwa + boot ----------------------------- */

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    try {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* offline install optional */ });
    } catch (e) { /* ignore */ }
  }

  render();
})();

</script>
